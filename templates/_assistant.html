<div id="aiWidget" class="ai-widget" data-no-i18n-root>
  <button id="aiFab" class="ai-fab" type="button" aria-label="Open AgroConnect assistant" aria-expanded="false">
    <i class="fa-solid fa-wand-magic-sparkles"></i><span class="ai-fab-label">Ask AI</span>
  </button>
  <section id="aiPanel" class="ai-panel" role="dialog" aria-label="AgroConnect assistant" hidden>
    <header class="ai-head">
      <div class="ai-avatar"><i class="fa-solid fa-seedling"></i></div>
      <div><strong>AgroConnect Assistant</strong><small id="aiMode"><span class="ai-dot"></span> Online</small></div>
      <button id="aiClear" class="ai-icon" type="button" aria-label="New chat" title="New chat"><i class="fa-solid fa-rotate-right"></i></button>
      <button id="aiClose" class="ai-icon" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    </header>
    <div id="aiLog" class="ai-log" aria-live="polite"></div>
    <div id="aiChips" class="ai-chips" data-no-i18n></div>
    <form id="aiForm" class="ai-form" autocomplete="off">
      <button id="aiMic" class="ai-icon" type="button" aria-label="Speak" title="Speak" hidden><i class="fa-solid fa-microphone"></i></button>
      <input id="aiInput" type="text" maxlength="500" placeholder="Ask about products, crops, delivery…" aria-label="Your question">
      <button class="ai-send" type="submit" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button>
    </form>
    <p class="ai-foot">AI can make mistakes. Check product details before buying.</p>
  </section>
</div>
